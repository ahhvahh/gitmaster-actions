name: Go 1.27 validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go127-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit, race and vet (Go 1.27.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false # The lockfile will be generated once and committed.
      - name: Verify toolchain
        run: go version
      - name: Download module dependencies
        run: go mod download
      - name: Resolve and normalize dependencies
        run: go mod tidy
      - name: Export module lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: go127-module-lock
          path: |
            go.mod
            go.sum
          retention-days: 3
      - name: Run tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
