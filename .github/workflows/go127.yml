name: Go 1.27 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go127-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit, race and vet (Go 1.27.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go.sum
      - name: Unit tests, race detector and static analysis
        run: bash tests/run.sh --mode unit
      - name: Confirm project-named binary
        run: test -x tests/bin/gitmaster-actions
